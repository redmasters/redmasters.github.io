# Hugo configuration file
title: Erasmo Jr.
defaultContentLanguage: pt-br
defaultContentLanguageInSubdir: false
languages:
  pt-br:
    languageName: Português (Brasil)
    languageCode: pt-BR
    weight: 1
    title: Erasmo Jr.
    params:
      description: Blog de Erasmo Jr. sobre desenvolvimento de software, Rust, Java e projetos pessoais.
    menu:
      main:
        - name: Blog
          pageRef: /blog
          weight: 1
        - name: Sobre
          pageRef: /about
          weight: 2
        - name: Contato ↗
          url: "https://github.com/redmasters"
          weight: 3
        - name: Buscar
          weight: 4
          params:
            type: search
        - name: GitHub
          weight: 5
          url: "https://github.com/redmasters/redmasters.github.io"
          params:
            icon: github
  en:
    languageName: English
    languageCode: en-US
    weight: 2
    title: Erasmo Jr.
    params:
      description: Erasmo Jr.'s blog about software development, Rust, Java and personal projects.
    menu:
      main:
        - name: Blog
          pageRef: /blog
          weight: 1
        - name: About
          pageRef: /about
          weight: 2
        - name: Contact ↗
          url: "https://github.com/redmasters"
          weight: 3
        - name: Search
          weight: 4
          params:
            type: search
        - name: GitHub
          weight: 5
          url: "https://github.com/redmasters/redmasters.github.io"
          params:
            icon: github
  es:
    languageName: Español
    languageCode: es-ES
    weight: 3
    title: Erasmo Jr.
    params:
      description: Blog de Erasmo Jr. sobre desarrollo de software, Rust, Java y proyectos personales.
    menu:
      main:
        - name: Blog
          pageRef: /blog
          weight: 1
        - name: Sobre mí
          pageRef: /about
          weight: 2
        - name: Contacto ↗
          url: "https://github.com/redmasters"
          weight: 3
        - name: Buscar
          weight: 4
          params:
            type: search
        - name: GitHub
          weight: 5
          url: "https://github.com/redmasters/redmasters.github.io"
          params:
            icon: github
  
# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

enableGitInfo: true
params:
  displayUpdateDate: true
  dateFormat: "2 January, 2006"
  blog:
    list:
      displayTags: true
  toc:
    displayTags: true
    
  navbar:
    displayTitle: true
    displayLogo: true
  theme:
    default: dark
    displayToggle: true

  footer:
    displayCopyright: true
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/imfing/hextra-starter-template/edit/main/content"
